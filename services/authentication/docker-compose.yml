# Local dev only — spins up auth-service plus the infra it needs
# (Postgres + RabbitMQ). Not used in CI/CD; ECS/K8s manifests handle that.
version: "3.8"

services:
  auth-service:
    build: .
    ports:
      - "8080:8080"
    # Cognito ids, AWS credentials and admin bootstrap credentials come from .env,
    # which is gitignored. Create it first:  cp .env.example .env
    env_file:
      - .env
    environment:
      # Non-secret docker-network wiring stays here.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with other services' Postgres
    volumes:
      - auth_pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI

volumes:
  auth_pgdata:
