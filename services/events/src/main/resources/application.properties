# =====================================================================
# Events microservice configuration
# Any property can be overridden with an environment variable, e.g.
#   spring.datasource.url  ->  SPRING_DATASOURCE_URL
#   spring.rabbitmq.host   ->  SPRING_RABBITMQ_HOST
# The HTTP port defaults to 8080 (override with server.port / SERVER_PORT).
# =====================================================================

# Service name (appears in every log line as [events])
spring.application.name=events

# Event scheduling
# Spring cron format: second minute hour day-of-month month day-of-week
# Every minute:       0 * * * * *
# Every 5 minutes:    0 */5 * * * *
# Every hour:         0 0 * * * *
# Daily at midnight:  0 0 0 * * *
# Weekly on Sunday:   0 0 0 * * SUN
app.scheduling.event-check-cron=0 0 0 * * *

# Secrets are never stored in this file. They come from environment variables, or locally from a
# git-ignored .env or dev.env file in the project root (see README). Missing passwords fail startup clearly.
spring.config.import=optional:file:.env[.properties],optional:file:dev.env[.properties]

# Cognito issuer used by Spring Security to discover the user-pool metadata and download its JWKS.
# Set AWS_REGION and COGNITO_USER_POOL_ID in the environment or in a git-ignored .env/dev.env file.
# Both have defaults (as in the auth service) so the service and its tests start without them (e.g. in CI): the token
# decoder is only built on the first authenticated request, which then fails until a real user pool id is set.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION:ap-southeast-1}.amazonaws.com/${COGNITO_USER_POOL_ID:}

# RabbitMQ Connection Settings (defaults of a local broker / the rabbitmq Docker image)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Exchange names this service publishes to (consumers bind their queues to these).
# Env var overrides: EVENTS_RABBITMQ_NOTIFICATIONS_EXCHANGE / EVENTS_RABBITMQ_PARTY_EVENTS_EXCHANGE
events.rabbitmq.notifications-exchange=notifications
events.rabbitmq.party-events-exchange=party.events

# RabbitMQ Listener & Retry Settings (PaymentRefundedListener)
# A failing message is retried 3 more times, then dropped (the queue is owned by the payment service and has no
# dead-letter exchange). Malformed messages are dropped at once by the listener itself.
# (Spring Boot 4 calls the retry limit max-retries; Boot 3 called it max-attempts, which Boot 4 no longer reads.)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-retries=3

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000ms
spring.rabbitmq.template.retry.max-retries=3
spring.rabbitmq.template.retry.multiplier=2.0

# Outbox for event.cancelled (the message the payment service's refunds hang on, see messaging/Outbox.java): it is
# published only once the broker confirms it (publisher confirms) and routed it to a queue (publisher returns).
# Unconfirmed messages stay in the outbox_messages table and are re-sent every relay-cron run.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Only the outbox publishes mandatory messages (its own template): notifications stay fire-and-forget, and an
# unbound notifications exchange must not log a returned message for each of them
spring.rabbitmq.template.mandatory=false
events.outbox.relay-cron=*/10 * * * * *
events.outbox.confirm-timeout=5s
# Carry the trace across RabbitMQ: publishing adds a traceparent header, consuming continues that trace.
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Payment microservice, called synchronously during signup and payment retries (POST /bookings, POST /payments).
# No database transaction or row lock is held while it is called; the timeouts cap how long a request waits.
# Env var overrides: EVENTS_PAYMENT_BASE_URL / EVENTS_PAYMENT_CONNECT_TIMEOUT / EVENTS_PAYMENT_READ_TIMEOUT
# The default is compose.yaml's payment-stub (WireMock) as seen from this machine; deployments always set the URL.
events.payment.base-url=http://localhost:8089
events.payment.connect-timeout=2s
events.payment.read-timeout=10s
# Internal service key the payment service requires on POST /payments/{id}/refund (its payment_service_api_key).
# Without it every compensation refund is refused with 401 and stays owed until the key is set.
# Either env var name works, as in the payment service, so both ECS task definitions can use the same secret entry.
events.payment.service-api-key=${PAYMENT_SERVICE_API_KEY:${payment_service_api_key:}}
# Payment recovery job: retries owed compensation refunds, and confirms PENDING bookings whose payment went through
# although its answer was lost (a timeout or outage mid-payment). Only bookings older than reconcile-after are
# checked, so a payment still in flight is left to its own request.
events.payment.recovery-cron=30 * * * * *
events.payment.reconcile-after=1m


# Local PostgeSQL Database Connection (create the database first: CREATE DATABASE events_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/events_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Properties
# ddl-auto=create: Hibernate creates tables to match the @Entity classes at startup (drops old schema at startup)
# show-sql/format_sql: print every SQL statement Hibernate runs to the console (useful while developing)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Health probes (Spring Boot Actuator). Only the health endpoint is exposed over HTTP, without details.
#   /actuator/health            overall status, including PostgreSQL and RabbitMQ
#   /actuator/health/liveness   is the JVM alive? Used by the Docker HEALTHCHECK (does not depend on other services)
#   /actuator/health/readiness  can it serve traffic? Includes the database, so it is not ready while PostgreSQL is down
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Distributed tracing (OpenTelemetry -> Jaeger): every HTTP request and RabbitMQ message becomes a span,
# and log lines carry the trace id. OTEL_EXPORTER_OTLP_ENDPOINT is Jaeger's OTLP/HTTP address
# (http://jaeger.<namespace>:4318 on AWS); Spring's default would keep only 10% of traces, hence 1.0.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# Traces only: metrics aren't collected
management.otlp.metrics.export.enabled=false

# Open-Session-in-View off: otherwise the JDBC connection taken by signup's first transaction stays held for the
# whole HTTP request, including the payment call, which defeats splitting signup into short transactions.
# Safe here because no entity has lazy relationships to load during view rendering.
spring.jpa.open-in-view=false
