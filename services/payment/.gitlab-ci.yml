####################################################################
# CI/CD pipeline for the Payment Service (Java / Spring Boot).
#
#   static_analysis   compile (and package the jar), Checkstyle, SpotBugs,
#                     dependency scan of the jar's bundled libraries,
#                     and GitLab's SAST and secret detection scanners.
#   test              JUnit/Mockito unit tests, then black-box
#                     integration tests against a real MySQL and
#                     RabbitMQ started with Docker Compose.
#   release           build the Docker image, smoke-test it (boot it
#                     against a real MySQL and RabbitMQ: healthy, API
#                     answers, endpoints still protected; ci/smoke-test.sh),
#                     and only then push it to this project's GitLab
#                     container registry, produce an SBOM, and scan the
#                     image for known vulnerabilities.
#
# Releasing means publishing the image only. Deploying is not done here: run the
# manual deploy-payment job in the infrastructure project, which deploys the
# image released for main's newest commit to AWS ECS (CloudFormation stack
# partyfun-payment). AWS credentials, the stack and its settings all live there
# (README: "Deploying to AWS ECS").
#
# Stripe: no CI job calls Stripe and no Stripe key is needed. Unit tests mock the PaymentGateway; the Stripe adapter
# tests and the integration tests use WireMock standing in for api.stripe.com. The running service (local stack,
# AWS) calls the real Stripe sandbox; live keys are refused by the service.
####################################################################

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - static_analysis
  - test
  - release

variables:
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-21"
  # Keep downloaded dependencies inside the project dir so they can be cached.
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

.maven:
  image: $MAVEN_IMAGE
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository

####################################################################
# Static analysis
####################################################################

compile:
  extends: .maven
  stage: static_analysis
  script:
    # -DskipTests still compiles the test sources but doesn't run them (unit-tests
    # does that). package also builds the jar that dependency-scan inspects.
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/payment.jar
    expire_in: 1 day

checkstyle:
  extends: .maven
  stage: static_analysis
  script:
    - mvn $MAVEN_CLI_OPTS checkstyle:check
  artifacts:
    when: always
    paths:
      - target/checkstyle-result.xml

spotbugs:
  extends: .maven
  stage: static_analysis
  script:
    - mvn $MAVEN_CLI_OPTS compile spotbugs:check
  artifacts:
    when: always
    paths:
      - target/spotbugsXml.xml

dependency-scan:
  stage: static_analysis
  # Uses the jar built by compile (needs works within the same stage).
  needs: ["compile"]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
  script:
    # Scans the libraries bundled in the built jar (BOOT-INF/lib), which are
    # exactly the dependencies that run in production. Trivy identifies them
    # from its own Java DB. Scanning pom.xml instead makes Trivy download every
    # parent/BOM POM from Maven Central, which rate-limits GitLab's shared
    # runners (HTTP 429) and kills the job before it scans anything.
    # rootfs, not fs: Trivy only analyses .jar files in rootfs/image mode.
    # pipefail: keep trivy's exit code even though its output goes through tee.
    - set -o pipefail
    - trivy rootfs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 target/ | tee dependency_scan_report.txt
  artifacts:
    when: always
    paths:
      - dependency_scan_report.txt
  # A CVE can be published overnight against a library pinned months ago,
  # with no fixed version available yet. Blocking every push on that would
  # stop the team, so this job reports rather than halts.

# GitLab's security templates put their jobs in the 'test' stage. These
# two blocks re-declare the jobs by name, which merges the new key into
# the template's definition rather than replacing it, so all that changes
# is which stage they run in.
semgrep-sast:
  stage: static_analysis

secret_detection:
  stage: static_analysis

####################################################################
# Test
####################################################################

unit-tests:
  extends: .maven
  stage: test
  script:
    # verify = unit tests + JaCoCo coverage report
    - mvn $MAVEN_CLI_OPTS verify
    - 'awk -F, ''NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "Line coverage: %.1f%%\n", 100*c/(m+c)}'' target/site/jacoco/jacoco.csv || true'
  coverage: '/Line coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/site/jacoco/

integration-tests:
  stage: test
  image: docker:29.6.2
  services:
    - docker:29.6.2-dind
  variables:
    COMPOSE_FILE: ci/compose.test.yaml
  script:
    # Starts MySQL (official image), RabbitMQ, WireMock (as Stripe), the Payment Service and the JUnit
    # integration-test runner (mvn -P integration verify). The job's exit code is
    # the test container's exit code, so failed tests fail the job.
    - docker compose up --build --abort-on-container-exit --exit-code-from tests
    # If the Payment Service fails to start, the tests container never runs and Compose can still exit 0. Fail the
    # job unless the tests container actually ran and succeeded.
    - >
      if [ "$(docker compose ps -a --format '{{.ExitCode}}' tests)" != "0" ]; then
      echo "The integration-test container did not run to completion (did the Payment Service start?)"; exit 1;
      fi
  after_script:
    # Always runs, pass or fail: keep the logs and report, then tear everything down.
    - mkdir -p ci/reports
    - docker compose -f ci/compose.test.yaml logs --no-color > ci/reports/compose.log 2>&1 || true
    - docker compose -f ci/compose.test.yaml cp tests:/build/target/failsafe-reports ci/reports/ || true
    - docker compose -f ci/compose.test.yaml down -v --remove-orphans
  artifacts:
    when: always
    reports:
      junit: ci/reports/failsafe-reports/TEST-*.xml
    paths:
      - ci/reports/

####################################################################
# Release (publish the image only - no deployment)
####################################################################

# based on: https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Docker.gitlab-ci.yml
release-image:
  stage: release
  image: docker:29.6.2
  services:
    - docker:29.6.2-dind
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
  before_script:
    # The password goes in on stdin rather than as an argument, so that
    # it never appears in the runner's process list.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - wget -qO install.sh https://raw.githubusercontent.com/anchore/syft/main/install.sh
    - sh install.sh -b /usr/local/bin v1.50.0
  script:
    - docker build --pull -t "$IMAGE" .
    # Prove the image boots and works before anyone can pull it (same check as the Authentication, Events and User
    # services). No Stripe key or other secret is needed: the script never calls Stripe.
    - sh ci/smoke-test.sh "$IMAGE"
    - docker push "$IMAGE"
    # The SBOM inventories the released image itself, not just pom.xml,
    # so it covers everything the base image brings along too.
    - docker save "$IMAGE" -o image.tar
    - syft docker-archive:image.tar -o cyclonedx-json=sbom.json
  artifacts:
    when: on_success
    paths:
      - sbom.json

container-scan:
  stage: release
  needs: ["release-image"]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    # Must match release-image's tag.
    IMAGE: "$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
    TRIVY_NO_PROGRESS: "true"
  script:
    # Report CRITICAL vulnerabilities that already have a fix.
    - set -o pipefail
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE" | tee trivy_report.txt
  artifacts:
    when: always
    paths:
      - trivy_report.txt
  # Same reasoning as dependency-scan: report, don't block the team.
  allow_failure: true
