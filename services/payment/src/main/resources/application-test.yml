# Docker integration-test profile (ci/compose.test.yaml), started with stage=test.
#
# Safety: this profile ignores db_host/db_port/db_name and always connects to the throw-away MySQL
# container (hostname "mysql"), because create-drop wipes the schema. It can never point at the local
# development database by accident.

spring:
  datasource:
    url: jdbc:mysql://${test_db_host:mysql}:3306/payment
  jpa:
    hibernate:
      ddl-auto: create-drop

# Integration tests: "Stripe" is the WireMock container (stripe_api_base, ci/compose.test.yaml). Only this profile
# reads stripe_api_base, so the running service (dev, AWS) can never be pointed away from the real Stripe sandbox.
stripe:
  api-base: ${stripe_api_base:}

payment:
  refund:
    backoff-ms: 100

logging:
  level:
    # create-drop on a brand-new database logs a harmless "table doesn't exist" warning on the first drop
    org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl: ERROR
