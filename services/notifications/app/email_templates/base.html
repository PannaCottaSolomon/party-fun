<!DOCTYPE html>
<html>
<body style="margin:0;padding:24px;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:24px 28px 8px;font-size:13px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:#5b5bd6;">{{ app_name }}</td>
    </tr>
    <tr>
      <td style="padding:0 28px 24px;font-size:15px;line-height:1.55;">
        <h1 style="font-size:20px;margin:8px 0 16px;">{% block heading %}{% endblock %}</h1>
        <p>Hi {{ name }},</p>
        {% block body %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">
        This is an automated message from {{ app_name }}. Please do not reply.
      </td>
    </tr>
  </table>
</body>
</html>
