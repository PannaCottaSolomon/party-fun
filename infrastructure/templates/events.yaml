AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  party.fun Event Service: its PostgreSQL database on Amazon RDS, and the service on Amazon ECS (Fargate), both in
  the account's default VPC. ECS pulls the image straight from the events project's GitLab container registry.
  Needs the secrets and cognito stacks.

Parameters:
  Prefix:
    Type: String
    Default: partyfun
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Name prefix for every resource and export (lowercase).
  ImageUri:
    Type: String
    Description: >-
      The Event Service image in the GitLab registry, tagged with the commit it was built from
      (registry.gitlab.com/cs302-2026/g4-team2/services/events:<commit sha>), so every deploy of a new build changes
      the task definition and rolls the service.
  RegistryUsername:
    Type: String
    NoEcho: true
    Description: Username of a GitLab deploy token with the read_registry scope.
  RegistryToken:
    Type: String
    NoEcho: true
    Description: The deploy token itself.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The default VPC (the tasks and the database run in it).
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets of that VPC for the tasks (they get a public IP to reach GitLab, CloudWatch and Cognito).
  ExecutionRoleArn:
    Type: String
    Default: ''
    Description: >-
      An existing role ECS uses to pull the image, write logs and read the secrets (e.g. LabRole in an AWS Academy
      Learner Lab, which can't create IAM roles). Empty: this stack creates one.
  RabbitMqHost:
    Type: String
    Default: ''
    Description: >-
      The RabbitMQ broker's host name. Empty until the broker runs: the service still starts and serves requests, but
      publishing domain events fails.
  PaymentBaseUrl:
    Type: String
    Default: ''
    Description: >-
      The Payment Service's base URL (EVENTS_PAYMENT_BASE_URL). Empty until it runs: signups and payments then fail.
  ServicesSecurityGroupId:
    Type: String
    Default: ''
    Description: >-
      The cluster stack's shared services security group. RabbitMQ and the OpenTelemetry Collector only accept
      connections from it, so set it together with RabbitMqHost or OtlpEndpoint.
  NamespaceId:
    Type: String
    Default: ''
    Description: >-
      The cluster stack's private DNS namespace. When set, the service is registered in Cloud Map: reachable inside
      the VPC at events.<Prefix>.local:8080, and API Gateway routes to it.
  OtlpEndpoint:
    Type: String
    Default: ''
    Description: >-
      The observability stack's OpenTelemetry Collector (output OtlpEndpoint), where the service sends its traces.
      Empty: tracing is off (no spans are recorded or sent).
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Number of running tasks (0 stops the service but keeps the database).
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class of the events database.
  FaultInjection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      true: the task can take the chaos stack's network experiments (AWS FIS): an SSM agent sidecar, ECS fault
      injection, a shared PID namespace and a task role for the sidecar, with 2 GB of memory instead of 1 GB.
      false: none of that, the task is unchanged.

Conditions:
  CreateExecutionRole: !Equals [!Ref ExecutionRoleArn, '']
  HasFaultInjection: !Equals [!Ref FaultInjection, 'true']
  HasRabbitMq: !Not [!Equals [!Ref RabbitMqHost, '']]
  HasPayment: !Not [!Equals [!Ref PaymentBaseUrl, '']]
  HasServicesSecurityGroup: !Not [!Equals [!Ref ServicesSecurityGroupId, '']]
  HasOtlp: !Not [!Equals [!Ref OtlpEndpoint, '']]
  HasNamespace: !Not [!Equals [!Ref NamespaceId, '']]

Resources:
  # ECS logs in to registry.gitlab.com with this on every image pull (the CI job token expires with the job).
  RegistrySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/events-registry
      Description: GitLab deploy token (read_registry) ECS uses to pull the Event Service image.
      SecretString: !Sub '{"username":"${RegistryUsername}","password":"${RegistryToken}"}'

  # ---- Security groups: the only link between the service and its database ----

  # No load balancer: the task's public IP serves the API on port 8080 (every request needs a Cognito token).
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Event Service tasks (HTTP API on port 8080)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Events database (PostgreSQL from the Event Service tasks only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ---- Database: PostgreSQL 17 (as in the service's compose.yaml and tests), not public, encrypted ----

  # No DBSubnetGroupName: RDS uses the default VPC's subnets. The credentials are the shared application user from
  # the secrets stack (partyfun/database), so the database and the task definition can't drift apart. Deleting the
  # stack, or a change that replaces the instance, keeps a final snapshot.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${Prefix}-events-db
      Engine: postgres
      EngineVersion: '17.11'
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: events_db
      MasterUsername: !Sub '{{resolve:secretsmanager:${Prefix}/database:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${Prefix}/database:SecretString:password}}'
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

  # ---- ECS: one Fargate service ----

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${Prefix}-events

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Prefix}/events
      RetentionInDays: 14

  # Pulls the image, writes the logs, and reads only the secrets the task needs. The service itself calls no AWS API
  # (Cognito's signing keys are public), so the task has no role of its own.
  ExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateExecutionRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref RegistrySecret
                  - Fn::ImportValue: !Sub ${Prefix}-database-secret-arn
                  - Fn::ImportValue: !Sub ${Prefix}-rabbitmq-secret-arn
                  - Fn::ImportValue: !Sub ${Prefix}-payment-service-key-secret-arn

  # ---- Fault injection (FaultInjection=true only): how AWS FIS reaches the task ----
  # The sidecar registers the task in Systems Manager as a managed instance with this role, so FIS can send it the
  # network fault documents (see https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html).
  ManagedInstanceRole:
    Type: AWS::IAM::Role
    Condition: HasFaultInjection
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: deregister
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:DeleteActivation
                  - ssm:DeregisterManagedInstance
                Resource: '*'

  # Only the sidecar uses it (the Event Service itself still calls no AWS API): it creates the activation at task
  # start and removes it, and the managed instance, when the task stops.
  FaultInjectionTaskRole:
    Type: AWS::IAM::Role
    Condition: HasFaultInjection
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ssm-activation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:CreateActivation
                  - ssm:AddTagsToResource
                  - ssm:DeleteActivation
                  - ssm:DeregisterManagedInstance
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ManagedInstanceRole.Arn

  # Passwords are injected by ECS from Secrets Manager at task start; they never appear in the task definition.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Prefix}-events
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      # The fault injection sidecar installs packages at start: 2 GB so it can't squeeze the JVM.
      Memory: !If [HasFaultInjection, '2048', '1024']
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !If [CreateExecutionRole, !GetAtt ExecutionRole.Arn, !Ref ExecutionRoleArn]
      TaskRoleArn: !If [HasFaultInjection, !GetAtt FaultInjectionTaskRole.Arn, !Ref AWS::NoValue]
      # FIS's network actions on Fargate need both (and ECS Exec off, which it is).
      PidMode: !If [HasFaultInjection, task, !Ref AWS::NoValue]
      EnableFaultInjection: !If [HasFaultInjection, true, !Ref AWS::NoValue]
      ContainerDefinitions:
        - Name: events
          Image: !Ref ImageUri
          RepositoryCredentials:
            CredentialsParameter: !Ref RegistrySecret
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          # No load balancer, so ECS judges the task by readiness (includes the database). StartPeriod covers the
          # JVM's startup on 0.5 vCPU.
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          Environment:
            - Name: SPRING_DATASOURCE_URL
              Value: !Sub jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/events_db
            # The image's default (create) drops every table at startup; keep the data across restarts and deploys.
            - Name: SPRING_JPA_HIBERNATE_DDL_AUTO
              Value: update
            - Name: SPRING_JPA_SHOW_SQL
              Value: 'false'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: COGNITO_USER_POOL_ID
              Value:
                Fn::ImportValue: !Sub ${Prefix}-user-pool-id
            - !If
              - HasRabbitMq
              - Name: SPRING_RABBITMQ_HOST
                Value: !Ref RabbitMqHost
              - !Ref AWS::NoValue
            - !If
              - HasPayment
              - Name: EVENTS_PAYMENT_BASE_URL
                Value: !Ref PaymentBaseUrl
              - !Ref AWS::NoValue
            # Tracing (observability stack): spans go to the OpenTelemetry Collector, tagged with the image's commit.
            # Without the collector, sampling 0 records nothing instead of failing to send to localhost.
            - Name: TRACING_SAMPLING_PROBABILITY
              Value: !If [HasOtlp, '1.0', '0.0']
            - !If
              - HasOtlp
              - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                Value: !Ref OtlpEndpoint
              - !Ref AWS::NoValue
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub
                - deployment.environment.name=aws,service.version=${Version}
                - Version: !Select [1, !Split [':', !Ref ImageUri]]
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub ${Prefix}-database-secret-arn
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub ${Prefix}-database-secret-arn
            - Name: RABBITMQ_USERNAME
              ValueFrom: !Sub
                - '${Arn}:username::'
                - Arn:
                    Fn::ImportValue: !Sub ${Prefix}-rabbitmq-secret-arn
            - Name: RABBITMQ_PASSWORD
              ValueFrom: !Sub
                - '${Arn}:password::'
                - Arn:
                    Fn::ImportValue: !Sub ${Prefix}-rabbitmq-secret-arn
            # Sent as X-Service-Api-Key when Events asks Payment to refund a booking (POST /payments/{id}/refund).
            - Name: PAYMENT_SERVICE_API_KEY
              ValueFrom: !Sub
                - '${Arn}:payment_service_api_key::'
                - Arn:
                    Fn::ImportValue: !Sub ${Prefix}-payment-service-key-secret-arn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: events
        # SSM agent sidecar for AWS FIS (FaultInjection=true only), not essential: if it fails, the Event Service keeps
        # running and only the network experiments can't reach the task. The script is AWS's own, unchanged
        # (https://docs.aws.amazon.com/fis/latest/userguide/ecs-task-actions.html#ecs-task-reference).
        - !If
          - HasFaultInjection
          - Name: amazon-ssm-agent
            Image: public.ecr.aws/amazon-ssm-agent/amazon-ssm-agent:latest
            Essential: false
            Cpu: 0
            MemoryReservation: 256
            Environment:
              - Name: MANAGED_INSTANCE_ROLE_NAME
                Value: !Ref ManagedInstanceRole
            Command:
              - /bin/bash
              - -c
              - |
                set -e
                dnf upgrade -y
                dnf install jq procps awscli -y

                term_handler() {
                  echo "Deleting SSM activation $ACTIVATION_ID"
                  if ! aws ssm delete-activation --activation-id $ACTIVATION_ID --region $ECS_TASK_REGION; then
                    echo "SSM activation $ACTIVATION_ID failed to be deleted" 1>&2
                  fi
                  MANAGED_INSTANCE_ID=$(jq -e -r .ManagedInstanceID /var/lib/amazon/ssm/registration)
                  echo "Deregistering SSM Managed Instance $MANAGED_INSTANCE_ID"
                  if ! aws ssm deregister-managed-instance --instance-id $MANAGED_INSTANCE_ID --region $ECS_TASK_REGION; then
                    echo "SSM Managed Instance $MANAGED_INSTANCE_ID failed to be deregistered" 1>&2
                  fi
                  kill -SIGTERM $SSM_AGENT_PID
                }
                trap term_handler SIGTERM SIGINT

                if [[ -z $MANAGED_INSTANCE_ROLE_NAME ]] ; then
                  echo "Environment variable MANAGED_INSTANCE_ROLE_NAME not set, exiting" 1>&2
                  exit 1
                fi

                if ! ps ax | grep amazon-ssm-agent | grep -v grep > /dev/null; then
                  if [[ -n $ECS_CONTAINER_METADATA_URI_V4 ]] ; then
                    echo "Found ECS Container Metadata, running activation with metadata"
                    TASK_METADATA=$(curl "${ECS_CONTAINER_METADATA_URI_V4}/task")
                    ECS_TASK_AVAILABILITY_ZONE=$(echo $TASK_METADATA | jq -e -r '.AvailabilityZone')
                    ECS_TASK_ARN=$(echo $TASK_METADATA | jq -e -r '.TaskARN')
                    ECS_TASK_REGION=$(echo $ECS_TASK_AVAILABILITY_ZONE | sed 's/.$//')

                    ECS_TASK_AVAILABILITY_ZONE_REGEX='^(af|ap|ca|cn|eu|me|sa|us|us-gov)-(central|north|(north(east|west))|south|south(east|west)|east|west)-[0-9]{1}[a-z]{1}$'
                    if ! [[ $ECS_TASK_AVAILABILITY_ZONE =~ $ECS_TASK_AVAILABILITY_ZONE_REGEX ]] ; then
                      echo "Error extracting Availability Zone from ECS Container Metadata, exiting" 1>&2
                      exit 1
                    fi

                    ECS_TASK_ARN_REGEX='^arn:(aws|aws-cn|aws-us-gov):ecs:[a-z0-9-]+:[0-9]{12}:task/[a-zA-Z0-9_-]+/[a-zA-Z0-9]+$'
                    if ! [[ $ECS_TASK_ARN =~ $ECS_TASK_ARN_REGEX ]] ; then
                      echo "Error extracting Task ARN from ECS Container Metadata, exiting" 1>&2
                      exit 1
                    fi

                    CREATE_ACTIVATION_OUTPUT=$(aws ssm create-activation \
                      --iam-role $MANAGED_INSTANCE_ROLE_NAME \
                      --tags Key=ECS_TASK_AVAILABILITY_ZONE,Value=$ECS_TASK_AVAILABILITY_ZONE Key=ECS_TASK_ARN,Value=$ECS_TASK_ARN Key=FAULT_INJECTION_SIDECAR,Value=true \
                      --region $ECS_TASK_REGION)

                    ACTIVATION_CODE=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationCode)
                    ACTIVATION_ID=$(echo $CREATE_ACTIVATION_OUTPUT | jq -e -r .ActivationId)

                    if ! amazon-ssm-agent -register -code $ACTIVATION_CODE -id $ACTIVATION_ID -region $ECS_TASK_REGION; then
                      echo "Failed to register with AWS Systems Manager (SSM), exiting" 1>&2
                      exit 1
                    fi

                    amazon-ssm-agent &
                    SSM_AGENT_PID=$!
                    wait $SSM_AGENT_PID
                  else
                    echo "ECS Container Metadata not found, exiting" 1>&2
                    exit 1
                  fi
                else
                  echo "SSM agent is already running, exiting" 1>&2
                  exit 1
                fi
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref LogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: ssm-agent
          - !Ref AWS::NoValue

  # events.<Prefix>.local -> the running tasks' private IPs (A), and IP + port (SRV) for API Gateway's private
  # integration, which looks the tasks up here (only with the cluster stack's namespace).
  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasNamespace
    Properties:
      Name: events
      NamespaceId: !Ref NamespaceId
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
          - Type: SRV
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # Rolling deploy: the new task must become healthy before the old one stops. If it never does, the circuit breaker
  # rolls back to the previous task definition and the CloudFormation update fails.
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: events
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !If
            - HasServicesSecurityGroup
            - [!Ref ServiceSecurityGroup, !Ref ServicesSecurityGroupId]
            - [!Ref ServiceSecurityGroup]
      ServiceRegistries: !If
        - HasNamespace
        - - RegistryArn: !GetAtt DiscoveryService.Arn
            ContainerName: events
            ContainerPort: 8080
        - !Ref AWS::NoValue
      PropagateTags: SERVICE

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub ${Prefix}-events-cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DatabaseEndpoint:
    Description: The events database's host name (reachable from the Event Service tasks only)
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${Prefix}-events-db-endpoint
  InternalUrl:
    Condition: HasNamespace
    Description: The service's address inside the VPC
    Value: !Sub http://events.${Prefix}.local:8080
  DiscoveryServiceArn:
    Condition: HasNamespace
    Description: The Cloud Map service API Gateway routes to (api stack)
    Value: !GetAtt DiscoveryService.Arn
    Export:
      Name: !Sub ${Prefix}-events-discovery-arn
  LogGroupName:
    Value: !Ref LogGroup
  ImageUri:
    Description: The image the service runs
    Value: !Ref ImageUri
