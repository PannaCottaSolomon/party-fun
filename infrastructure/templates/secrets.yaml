AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  party.fun shared secrets in AWS Secrets Manager. Keys and passwords are generated here; the Stripe values are
  CHANGE_ME placeholders that you replace after the first deploy, so no real secret is ever in this repository.

Parameters:
  Prefix:
    Type: String
    Default: partyfun
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
    Description: Name prefix for every resource and export (lowercase).

Resources:
  # Payment Service: Stripe sandbox keys (set by hand) + the Admin operator key (generated).
  # Do not change GenerateSecretString after setting the Stripe values: CloudFormation would regenerate the secret.
  PaymentSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/payment
      Description: >-
        Payment Service. Replace the CHANGE_ME values with Stripe SANDBOX keys (sk_test_..., whsec_..., pk_test_...)
        after the first deploy; payment_admin_api_key is generated.
      GenerateSecretString:
        SecretStringTemplate: >-
          {"stripe_secret_key":"CHANGE_ME","stripe_webhook_secret":"CHANGE_ME","stripe_publishable_key":"CHANGE_ME"}
        GenerateStringKey: payment_admin_api_key
        PasswordLength: 48
        ExcludePunctuation: true

  # Service-to-service key: the Event Service sends it as X-Service-Api-Key to POST /payments/{id}/refund.
  PaymentServiceKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/payment-service-key
      Description: Internal service key (payment_service_api_key), shared by the Payment and Event Services.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: payment_service_api_key
        PasswordLength: 48
        ExcludePunctuation: true

  # MySQL (RDS) application user. Characters RDS rejects in passwords are excluded.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/database
      Description: Application database credentials (for the RDS stack and the services' task definitions).
      GenerateSecretString:
        SecretStringTemplate: '{"username":"partyfun"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'' '

  # RabbitMQ (its own ECS service) user shared by Payment, Events and Notifications.
  RabbitMqSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/rabbitmq
      Description: RabbitMQ credentials shared by the broker container and the services that connect to it.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"partyfun"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Notification Service: the Resend API key (set by hand, like the Stripe keys) and the key its HTTP API requires
  # (X-API-Key, generated). Do not change GenerateSecretString after setting the Resend key: it would be regenerated.
  NotificationsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${Prefix}/notifications
      Description: >-
        Notification Service. Replace CHANGE_ME with the Resend API key (re_...) after the first deploy; api_key
        (the X-API-Key its HTTP API requires) is generated.
      GenerateSecretString:
        SecretStringTemplate: '{"resend_api_key":"CHANGE_ME"}'
        GenerateStringKey: api_key
        PasswordLength: 40
        ExcludePunctuation: true

Outputs:
  PaymentSecretArn:
    Description: Payment Service secret (Stripe keys, admin key)
    Value: !Ref PaymentSecret
    Export:
      Name: !Sub ${Prefix}-payment-secret-arn
  PaymentServiceKeySecretArn:
    Description: Internal service key shared by Payment and Events
    Value: !Ref PaymentServiceKeySecret
    Export:
      Name: !Sub ${Prefix}-payment-service-key-secret-arn
  DatabaseSecretArn:
    Description: Database credentials
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub ${Prefix}-database-secret-arn
  RabbitMqSecretArn:
    Description: RabbitMQ credentials
    Value: !Ref RabbitMqSecret
    Export:
      Name: !Sub ${Prefix}-rabbitmq-secret-arn
  NotificationsSecretArn:
    Description: Notification Service secret (Resend API key, HTTP API key)
    Value: !Ref NotificationsSecret
    Export:
      Name: !Sub ${Prefix}-notifications-secret-arn
